<!DOCTYPE html>
<html lang="en" data-bs-theme="light" data-app-theme="academic">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Reset Complete - SchoolApp</title>
    {% load static %}
    {% include 'partials/_theme_boot.html' %}
    {% include 'partials/_styles.html' %}
  </head>

  <body class="bg-light">
    <div class="container">
      <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-md-6 col-lg-4">
          <div class="card shadow">
            <div class="card-body p-4">
              <div class="alert alert-success mb-3">
                <p class="mb-0">Your password has been reset successfully.</p>
              </div>
              <div class="text-center">
                <a href="{% url 'quiz_app:login' %}" class="btn btn-primary">Log in</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="{% static 'vendor/bootstrap/5.3.3/js/bootstrap.bundle.min.js' %}"></script>
  </body>
</html>
